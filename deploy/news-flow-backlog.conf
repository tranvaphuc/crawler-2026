[Service]
# Temporary backlog profile. Remove this drop-in to restore the base seed/article budget.
Environment=NEWS_ARTICLE_BACKLOG_FIRST=1
Environment=NEWS_SEED_PAUSED=1
Environment=NEWS_ARTICLE_DISCOVERY_PAUSED=1
ExecStart=
ExecStart=/opt/news-flow/node/bin/node scripts/run_news_flow.mjs --write --external-writer --proof /etc/news-flow/identity-proof.json --state /var/lib/news-flow/news-flow-runtime/write.sqlite --seed-concurrency 8 --article-concurrency 64 --parser-workers 4
