[Unit]
Wants=crawler-queue-worker@facebook-sources.service crawler-queue-worker@facebook-comments.service crawler-queue-worker@social.service crawler-queue-worker@social-comments.service crawler-queue-worker@imports.service
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
EnvironmentFile=/etc/crawler-v8/roles/coordinator.env
ExecStart=
ExecStart=/opt/crawler-node/bin/node --max-old-space-size=1536 /opt/crawler-v8/current/scripts/crawler_queue_flow.mjs
MemoryMax=2G
